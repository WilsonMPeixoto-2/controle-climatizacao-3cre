name: Package refresh

on:
  push:
    branches:
      - feat/firebase-spark-migration
    paths:
      - .github/package-refresh-trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/firebase-spark-migration

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install current lockfile
        run: npm ci

      - name: Apply release hardening mutations
        run: node .github/scripts/release-hardening.mjs

      - name: Format changed files
        run: npx prettier --write src/index.css vite.config.js package.json

      - name: Verify security audit
        run: npm audit --audit-level=high

      - name: Verify application build
        run: npm run build

      - name: Verify Firestore emulator suite
        run: npm run test:firestore

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh visual baselines
        env:
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_PROJECT_ID: ''
          VITE_FIREBASE_APP_ID: ''
        run: npx playwright test e2e/visual.spec.js --update-snapshots

      - name: Verify complete E2E suite
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_PROJECT_ID: ''
          VITE_FIREBASE_APP_ID: ''
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-release.log

      - name: Upload E2E diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-log
          path: e2e-release.log
          if-no-files-found: ignore

      - name: Commit verified release hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/ci.yml
          git add package.json package-lock.json vite.config.js .env.example src/index.css e2e
          if git diff --cached --quiet; then
            echo "No release hardening changes to commit."
          else
            git commit -m "chore: harden Firebase release candidate"
            git pull --rebase origin feat/firebase-spark-migration
            git push origin HEAD:feat/firebase-spark-migration
          fi
