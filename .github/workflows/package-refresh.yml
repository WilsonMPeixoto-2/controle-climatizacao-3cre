name: Package refresh

on:
  push:
    branches:
      - feat/firebase-spark-migration
    paths:
      - .github/package-refresh-trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/firebase-spark-migration

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Refresh production dependencies
        run: >-
          npm install
          @fontsource/inter@5.3.0
          @fontsource/outfit@5.3.0
          @supabase/supabase-js@2.112.2
          lucide-react@1.31.0
          polylabel@2.1.0
          react@19.2.8
          react-dom@19.2.8

      - name: Refresh development dependencies
        run: >-
          npm install -D
          @axe-core/playwright@4.12.1
          @playwright/test@1.62.1
          @types/react@19.2.18
          @types/react-dom@19.2.4
          @vitejs/plugin-react@6.0.5
          eslint@10.8.1
          globals@17.9.0
          prettier@3.9.6
          supabase@2.113.0
          vite@8.2.1
          vite-plugin-checker@0.14.5

      - name: Apply compatible audit fixes
        run: npm audit fix

      - name: Verify security gate
        run: npm audit --audit-level=high

      - name: Verify lint, unit/domain tests and production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record post-refresh diagnostics
        shell: bash
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_KEY: ''
        run: |
          mkdir -p docs/migration/package-refresh
          npm outdated --json > docs/migration/package-refresh/npm-outdated-after.json || true
          npm audit --json > docs/migration/package-refresh/npm-audit-after.json || true
          npm run test:e2e -- --reporter=line > docs/migration/package-refresh/e2e-after.txt 2>&1 || true

      - name: Commit verified dependency refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/migration/package-refresh
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: refresh dependencies before Firebase migration"
            git pull --rebase origin feat/firebase-spark-migration
            git push origin HEAD:feat/firebase-spark-migration
          fi
