name: Firebase tooling audit repair

on:
  push:
    branches:
      - feat/firebase-spark-migration
    paths:
      - .github/firebase-audit-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/firebase-spark-migration

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Record audit before repair
        shell: bash
        run: |
          mkdir -p docs/migration/firebase
          npm audit --json > docs/migration/firebase/npm-audit-before-fix.json || true

      - name: Apply compatible audit fixes only
        run: npm audit fix

      - name: Record audit after repair
        shell: bash
        run: npm audit --json > docs/migration/firebase/npm-audit-after-fix.json || true

      - name: Reject remaining high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify project after audit repair
        run: npm run build

      - name: Commit compatible audit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/migration/firebase/npm-audit-before-fix.json docs/migration/firebase/npm-audit-after-fix.json
          if git diff --cached --quiet; then
            echo "No compatible audit changes to commit."
          else
            git commit -m "chore: apply compatible Firebase tooling audit fixes"
            git pull --rebase origin feat/firebase-spark-migration
            git push origin HEAD:feat/firebase-spark-migration
          fi
