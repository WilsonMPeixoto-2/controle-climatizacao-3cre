name: Diagnose cloud admin credentials

on:
  push:
    branches:
      - infra/unlink-dead-supabase

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check credential availability without exposing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN=available"
          else
            echo "VERCEL_TOKEN=missing"
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN=available"
          else
            echo "SUPABASE_ACCESS_TOKEN=missing"
          fi
