name: Diagnose Vercel marketplace linkage

on:
  push:
    branches:
      - infra/unlink-dead-supabase

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check Vercel credential availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured in this repository."
            exit 2
          fi
          echo "Vercel credential is available."
      - name: List marketplace resources connected to climatizacao project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest integration list controle-climatizacao-3cre \
            --scope team_EFJunPOtGozS99jZ6zkIQXHF \
            --token "$VERCEL_TOKEN" \
            --format=json
