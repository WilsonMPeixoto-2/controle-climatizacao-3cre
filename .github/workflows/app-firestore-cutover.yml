name: App Firestore cutover

on:
  push:
    branches:
      - feat/firebase-spark-migration
    paths:
      - .github/app-firestore-cutover-trigger

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/firebase-spark-migration

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded App migration
        run: node .github/scripts/migrate-app-to-firestore.mjs

      - name: Format migrated App
        run: npx prettier --write src/App.jsx

      - name: Assert Supabase removed from runtime App
        shell: bash
        run: |
          if grep -in "supabase" src/App.jsx; then
            echo "Supabase reference remains in App.jsx"
            exit 1
          fi

      - name: Verify application build
        run: npm run build

      - name: Verify Firestore rules and adapter
        run: npm run test:firestore

      - name: Commit verified App cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: route application persistence through Firestore adapter"
          git pull --rebase origin feat/firebase-spark-migration
          git push origin HEAD:feat/firebase-spark-migration
