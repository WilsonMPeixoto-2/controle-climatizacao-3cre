name: App Firestore cutover

on:
  push:
    branches:
      - feat/firebase-spark-migration
    paths:
      - .github/app-firestore-cutover-trigger

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/firebase-spark-migration

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Refine migration guard for neutral persistence methods
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('.github/scripts/migrate-app-to-firestore.mjs')
          text = path.read_text(encoding='utf-8')
          service_pattern = r"^\s*'(?:insertHistoryEvent|updateTicketWithHistory|createTicketWithHistory)\(',\s*$\n?"
          text, service_count = re.subn(service_pattern, '', text, flags=re.MULTILINE)
          storage_pattern = r"^\s*'\.storage'\s*,?\s*$\n?"
          text, storage_count = re.subn(storage_pattern, '', text, flags=re.MULTILINE)
          if service_count != 3 or storage_count != 1:
              raise SystemExit(
                  f'Expected 3 service guards and 1 storage guard; got {service_count} and {storage_count}'
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply guarded App migration
        run: node .github/scripts/migrate-app-to-firestore.mjs

      - name: Refine derived React state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          state_line = "  const [schoolAttachments, setSchoolAttachments] = useState([]);\n"
          if text.count(state_line) != 1:
              raise SystemExit('Expected one schoolAttachments state declaration')
          text = text.replace(state_line, '')

          effect_block = """  // Anexos são preservados apenas como metadados legados durante a fase Firestore Spark.\n  useEffect(() => {\n    if (!selectedSchool?.designacao) {\n      setSchoolAttachments([]);\n      return;\n    }\n    setSchoolAttachments(\n      allAttachments.filter((attachment) => attachment.designacao === selectedSchool.designacao)\n    );\n  }, [selectedSchool, allAttachments]);\n\n"""
          derived_block = """  // Anexos são preservados apenas como metadados legados durante a fase Firestore Spark.\n  const schoolAttachments = useMemo(\n    () =>\n      selectedSchool?.designacao\n        ? allAttachments.filter(\n            (attachment) => attachment.designacao === selectedSchool.designacao\n          )\n        : [],\n    [selectedSchool, allAttachments]\n  );\n\n"""
          if text.count(effect_block) != 1:
              raise SystemExit('Expected one school attachment derivation effect')
          text = text.replace(effect_block, derived_block)

          sync_state = "  const [syncStatusText, setSyncStatusText] = useState('Local (db.json)');\n"
          sync_replacement = """  const [syncStatusText, setSyncStatusText] = useState(() =>\n    firebaseConfigured ? 'Local (db.json)' : 'Local (Firebase não configurado)'\n  );\n"""
          if text.count(sync_state) != 1:
              raise SystemExit('Expected one syncStatusText state declaration')
          text = text.replace(sync_state, sync_replacement)

          init_effect = """  useEffect(() => {\n    if (!firebaseConfigured) {\n      setIsInitialLoad(false);\n      setSyncStatusText('Local (Firebase não configurado)');\n      return undefined;\n    }\n\n    const timer = window.setTimeout(() => {\n      initializeFirebase();\n    }, 0);\n    return () => window.clearTimeout(timer);\n    // Configuração é imutável durante a sessão e vem do ambiente de build.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [firebaseConfigured]);\n"""
          init_replacement = """  useEffect(() => {\n    if (!firebaseConfigured) return undefined;\n\n    const timer = window.setTimeout(() => {\n      initializeFirebase();\n    }, 0);\n    return () => window.clearTimeout(timer);\n    // Configuração é imutável durante a sessão e vem do ambiente de build.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [firebaseConfigured]);\n"""
          if text.count(init_effect) != 1:
              raise SystemExit('Expected one Firebase initialization effect')
          text = text.replace(init_effect, init_replacement)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format migrated App
        run: npx prettier --write src/App.jsx

      - name: Assert Supabase removed from runtime App
        shell: bash
        run: |
          if grep -in "supabase" src/App.jsx; then
            echo "Supabase reference remains in App.jsx"
            exit 1
          fi

      - name: Assert Storage runtime API calls are gone
        shell: bash
        run: |
          if grep -n -C 8 "\.storage\." src/App.jsx; then
            echo "Direct Storage API reference remains in App.jsx"
            exit 1
          fi

      - name: Reject standalone legacy service calls
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/App.jsx').read_text(encoding='utf-8')
          for name in ('insertHistoryEvent', 'updateTicketWithHistory', 'createTicketWithHistory'):
              if re.search(rf'(?<![.\w]){name}\s*\(', text):
                  raise SystemExit(f'Legacy standalone call remains: {name}')
          PY

      - name: Verify application build
        run: npm run build

      - name: Verify Firestore rules and adapter
        run: npm run test:firestore

      - name: Commit verified App cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: route application persistence through Firestore adapter"
          git pull --rebase origin feat/firebase-spark-migration
          git push origin HEAD:feat/firebase-spark-migration
