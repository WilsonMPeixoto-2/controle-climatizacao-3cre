name: CI

on:
  push:
    branches:
      - feat/firebase-spark-migration
      - feat/prontuario-climatizacao-mvp
  pull_request:
    branches:
      - master
      - feat/firebase-spark-migration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Climate survey domain TDD gate
        run: node --test test/climate-survey.test.mjs

      - name: Lint
        run: npm run lint

      - name: Unit and domain tests
        run: npm test

      - name: Production build
        run: npx vite build

  firestore:
    name: Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore rules and persistence adapter
        run: npm run test:firestore

  e2e:
    name: Playwright baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ''
      VITE_FIREBASE_PROJECT_ID: ''
      VITE_FIREBASE_APP_ID: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e
